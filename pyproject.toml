[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frinkworks"
version = "0.1.0"
description = "Python-based media asset management and automated quality control platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",   # Import and related errors
    "E7",   # Statement errors
    "E9",   # Syntax errors
    "F",    # Pyflakes: undefined names, unused imports, etc.
    "I",    # Import sorting
    "B",    # Common bug patterns
    "UP",   # Modern Python syntax
]